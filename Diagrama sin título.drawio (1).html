    &lt;UserObject label=\&quot;&amp;lt;b&amp;gt;1. INGRESA ALERTA EN PLATAFORMA&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;La llamada aparece en la plataforma. Al aceptarla se abre el perfil del cliente con su info básica y la alerta o evento detectado.\&quot; id=\&quot;nIxEbo9_2ENa6OY-K7sx-2\&quot;&gt;\n          &lt;mxCell parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#666666;fontSize=12;arcSize=10;\&quot; vertex=\&quot;1\&quot;&gt;\n            &lt;mxGeometry height=\&quot;70\&quot; width=\&quot;500\&quot; x=\&quot;577\&quot; y=\&quot;110\&quot; as=\&quot;geometry\&quot; /&gt;\n          &lt;/mxCell&gt;\n        &lt;/UserObject&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-3\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#dae8fc;strokeColor=#6c8ebf;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;2. PRESENTACIÓN COMPLETA Y FLUIDA&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;📋 &amp;lt;i&amp;gt;Ir a la solapa del evento y asignarla al nombre seleccionando &amp;quot;Usuario conectado&amp;quot;&amp;lt;/i&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#1a5276&amp;quot;&amp;gt;&amp;quot;Buenos días/tardes/noches (según horario) Sr/Sra XX XX, mi nombre es XX XX. Me comunico de Ellie Center porque recibimos un pedido de ayuda / una alerta de posible caída. ¿Se encuentra bien?&amp;quot;&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;130\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;220\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-4\&quot; parent=\&quot;1\&quot; style=\&quot;rhombus;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=13;fontStyle=1;\&quot; value=\&quot;&amp;lt;b&amp;gt;¿CUÁL ES EL ESCENARIO?&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;A partir de la respuesta del afiliado/a se determinan 3 posibles casos\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;100\&quot; width=\&quot;500\&quot; x=\&quot;577\&quot; y=\&quot;375\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-5\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=13;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVENTO FALSO (EF)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;El/la afiliado/a indica que se encuentra bien y que fue un error.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;70\&quot; width=\&quot;370\&quot; x=\&quot;30\&quot; y=\&quot;390\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-6\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EF-1: CONFIRMAR MÍNIMO 2 VECES&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#1d6a27&amp;quot;&amp;gt;&amp;quot;¿Seguro/a que se encuentra bien? ¿No necesita asistencia médica ni de su red de apoyo?&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;⚠️ Es obligatorio corroborar un mínimo de 2 veces que esté bien.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;130\&quot; width=\&quot;370\&quot; x=\&quot;30\&quot; y=\&quot;510\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-7\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EF-2: IDENTIFICAR CAUSA DE LA ALERTA&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Intentar entender qué activó la alerta (si aún no lo han dicho).&amp;lt;br&amp;gt;El objetivo es dejarlo registrado en el comentario del caso.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;100\&quot; width=\&quot;370\&quot; x=\&quot;30\&quot; y=\&quot;690\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-8\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#d5e8d4;strokeColor=#82b366;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EF-3: DESPEDIDA&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#1d6a27&amp;quot;&amp;gt;&amp;quot;Me alegro de que se encuentre bien. Muchas gracias por elegirnos, que tenga buen día / buenas noches.&amp;quot;&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;100\&quot; width=\&quot;370\&quot; x=\&quot;30\&quot; y=\&quot;840\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-9\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#82b366;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EF-4: TIPIFICAR Y CERRAR&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;📋 En el cuadro &amp;quot;Estado&amp;quot; tipificar como: &amp;lt;b&amp;gt;EF&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Registrar en comentarios/bitácora la causa de la alerta.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;100\&quot; width=\&quot;370\&quot; x=\&quot;30\&quot; y=\&quot;990\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-10\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=13;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVENTO VERDADERO SIN ASISTENCIA (EVN)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;El/la afiliado/a confirma que efectivamente pidió ayuda o que se cayó, pero NO requiere asistencia.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;70\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;523\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-11\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-1: OFRECER ASISTENCIA (automáticamente)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#6c3483&amp;quot;&amp;gt;&amp;quot;Entiendo lo sucedido. ¿Requiere asistencia médica o de su red de apoyo?&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;El/la afiliado/a indicará que NO requiere asistencia médica ni quiere que llamemos a la red de ayuda.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;130\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;642\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-12\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-2: CONFIRMAR MÍNIMO 2 VECES&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#6c3483&amp;quot;&amp;gt;&amp;quot;¿Seguro/a que no quiere que pidamos asistencia médica o de su red de apoyo?&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;⚠️ Es imprescindible corroborar un mínimo de 2 veces que se encuentre bien.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;130\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;827\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-13\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-3: DESPEDIDA + RECORDATORIO&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#6c3483&amp;quot;&amp;gt;&amp;quot;Me alegro de que se encuentre bien. Recuerde que si necesita ayuda puede activar el botón de pedido de ayuda y lo asistiremos de inmediato. Gracias por elegirnos y que tenga un buen día / buenas noches.&amp;quot;&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;110\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;1006\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-14\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-4: TIPIFICAR COMO EVN – ABIERTO&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;📋 El caso queda en estado &amp;lt;b&amp;gt;EVN – ABIERTO&amp;lt;/b&amp;gt; porque dentro de los próximos &amp;lt;b&amp;gt;20 minutos&amp;lt;/b&amp;gt; se debe realizar una llamada de seguimiento.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;90\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;1169\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-15\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-5: LLAMADA DE SEGUIMIENTO (a los 20 min)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#6c3483&amp;quot;&amp;gt;&amp;quot;Buenos días/tardes/noches Sr/Sra XX XXX, soy XX XXX de Ellie Center nuevamente. Quería asegurarme que se encuentre bien.&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;⚠️ Pueden suceder 2 cosas: el/la afiliado/a confirma que está bien (→ continuar con EVN) o el caso escala a EVS.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;150\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;1293\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-16\&quot; parent=\&quot;1\&quot; style=\&quot;rhombus;whiteSpace=wrap;html=1;fillColor=#fff2cc;strokeColor=#d6b656;fontSize=13;\&quot; value=\&quot;&amp;lt;b&amp;gt;¿Confirma que está bien?&amp;lt;/b&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;80\&quot; width=\&quot;500\&quot; x=\&quot;577\&quot; y=\&quot;1497\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-17\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-6: ÚLTIMA CONFIRMACIÓN Y DESPEDIDA&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#6c3483&amp;quot;&amp;gt;&amp;quot;Me alegro de que se encuentre bien. Recuerde que si necesita ayuda puede activar el botón de pedido de ayuda y lo asistiremos de inmediato. Gracias por elegirnos y que tenga un buen día / buenas noches.&amp;quot;&amp;lt;/font&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;120\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;1649\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-18\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-7: ENVÍO DE MENSAJE WPP&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Pasos:&amp;lt;br&amp;gt;1️⃣ Ir a &amp;quot;Crear tarea&amp;quot;&amp;lt;br&amp;gt;2️⃣ Seleccionar envío de WPP&amp;lt;br&amp;gt;3️⃣ Copiar el nombre del caso (usar botón de copiado disponible)&amp;lt;br&amp;gt;4️⃣ Copiar ID de afiliado: clic en el nombre del cliente (en color celeste) → se abre el perfil → copiar el ID marcado en amarillo&amp;lt;br&amp;gt;5️⃣ Seleccionar tipo de solicitud &amp;lt;b&amp;gt;C: &amp;quot;Logramos contactar al afiliado y no requiere ayuda&amp;quot;&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;6️⃣ Completar el tipo de alerta recibida&amp;lt;br&amp;gt;7️⃣ Hacer clic en &amp;lt;b&amp;gt;Enviar&amp;lt;/b&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;200\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;1794\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-19\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#e1d5e7;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-8: LLAMAR AL AP (Acompañante Principal / Acompañante N°1)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;Comunicarse con el AP e informarle la situación (que hubo un evento, que el/la afiliado/a se encuentra bien y no requiere ayuda).\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;100\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;2026\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-20\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f5f5f5;strokeColor=#9673a6;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVN-9: COMPLETAR BITÁCORA Y CERRAR&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;📋 Completar comentarios/bitácora del caso.&amp;lt;br&amp;gt;Modificar el estado de &amp;lt;b&amp;gt;EVN – ABIERTO&amp;lt;/b&amp;gt; a &amp;lt;b&amp;gt;EVN – CERRADO&amp;lt;/b&amp;gt;.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;80\&quot; width=\&quot;700\&quot; x=\&quot;477\&quot; y=\&quot;2147\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-21\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;fontSize=13;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVENTO VERDADERO CON ASISTENCIA (EVS)&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Caso más complejo. El/la cliente necesita ayuda (se descompensó, se siente mal, se cayó, etc.). Actuar con &amp;lt;b&amp;gt;calma y orden&amp;lt;/b&amp;gt;.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;80\&quot; width=\&quot;370\&quot; x=\&quot;1254\&quot; y=\&quot;390\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;nIxEbo9_2ENa6OY-K7sx-22\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#f8cecc;strokeColor=#b85450;fontSize=12;\&quot; value=\&quot;&amp;lt;b&amp;gt;EVS-1: OBTENER INFORMACIÓN DEL AFILIADO&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;🎙️ SPEECH:&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#922b21&amp;quot;&amp;gt;&amp;quot;¿Dónde se encuentra?&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#922b21&amp;quot;&amp;gt;&amp;quot;Voy a solicitar la asistencia médica, necesito preguntarle un poco más qué fue lo que le sucedió así le brindo la información a la ambulancia.&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;font color=&amp;quot;#922b21&amp;quot;&amp;gt;&amp;quot;¿Se encuentra solo/a actualmente?&amp;quot;&amp;lt;/font&amp;gt;&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;⚠️ Se pueden sumar consultas pertinentes al caso, SIEMPRE que no involucren consejos o indicaciones médicas de ninguna índole.\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;200\&quot; width=\&quot;370\&quot; x=\&quot;1254\&quot; y=\&quot;5
